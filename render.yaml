services:
  - type: web
    name: okoc-unofficial-online
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OKOC_DEV_MODE
        value: "1"
